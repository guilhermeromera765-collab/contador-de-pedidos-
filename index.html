<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f6f7;--cd:#fff;--tx:#1d1d21;--mut:#6b6b76;--bd:#e4e4e8;--r:#c62828;--r2:#8e1b1b;--y:#fbc02d;--ok:#2e7d32;--sh:0 1px 3px #0001,0 4px 14px #0000000a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--cd:#1c1c20;--tx:#f1f1f3;--mut:#a0a0ab;--bd:#2c2c33;--r:#ef5350;--ok:#66bb6a;--sh:none}}
:root[data-theme="dark"]{--bg:#121214;--cd:#1c1c20;--tx:#f1f1f3;--mut:#a0a0ab;--bd:#2c2c33;--r:#ef5350;--ok:#66bb6a;--sh:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 20px;background:linear-gradient(120deg,#8e1b1b,#c62828);color:#fff;border-bottom:3px solid var(--y)}
.brand{display:flex;gap:12px;align-items:center}.brand i{width:38px;height:38px;border-radius:10px;background:var(--y);color:#8e1b1b;display:grid;place-items:center;font:800 20px/1 system-ui;font-style:normal}.brand b{display:block;font-size:16px;letter-spacing:.3px}.brand small{opacity:.8}
.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px}.pill{padding:3px 10px;border-radius:99px;background:#fff2;border:1px solid #fff3}
header button{background:#fff2;color:#fff;border:1px solid #fff4;border-radius:8px;padding:5px 12px;cursor:pointer}
.app{display:grid;grid-template-columns:244px minmax(0,1fr)}.ct{min-width:0}
#sb{background:var(--cd);border-right:1px solid var(--bd)}
#nv{position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:14px 10px 20px}
.grp{margin-bottom:8px}
.gh{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;color:var(--mut);font-family:inherit;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;padding:8px;cursor:pointer}
.gh .ico{width:14px;height:14px;transition:transform .25s}.grp.closed .gh .ico{transform:rotate(-90deg)}
.gb{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s cubic-bezier(.23,1,.32,1)}.grp.closed .gb{grid-template-rows:0fr}
.gl{min-height:0;overflow:hidden;padding-left:10px}
.ni{position:relative;display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:8px;color:var(--mut);padding:9px 10px 9px 30px;font-family:inherit;font-size:13px;font-weight:600;text-align:left;cursor:pointer;transition:color .2s,background .2s}
.ni span{white-space:nowrap}
.ni:before{content:'';position:absolute;left:4px;top:0;width:15px;height:50%;border-left:1.5px solid var(--bd);border-bottom:1.5px solid var(--bd);border-bottom-left-radius:9px;transition:border-color .25s}
.ni:not(:last-child):after{content:'';position:absolute;left:4px;top:50%;bottom:0;border-left:1.5px solid var(--bd)}
.ni:hover{color:var(--tx)}.ni.on{color:var(--r);background:color-mix(in srgb,var(--y) 16%,transparent)}.ni.on:before{border-color:var(--y)}.ni.lk{opacity:.45}
.ico{width:16px;height:16px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--y);display:inline-block;margin-right:6px}.dot.on{background:#66bb6a}.dot.off{background:#ff8a80}
.pill{display:inline-flex;align-items:center}header button{display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
.g2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}.g2>.card{margin-bottom:14px}
.ar{width:100%;height:auto;display:block}.ar .gd{stroke:var(--bd);stroke-dasharray:3 4}.ar .ax{fill:var(--mut);font:10px system-ui}.ar .pt{fill:var(--cd);stroke:var(--r);stroke-width:2}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.dt{fill:var(--tx);font:700 22px system-ui}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13px;flex:1;min-width:130px}.lg li{display:flex;align-items:center;gap:8px}.lg li b{margin-left:auto}.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.strip svg{flex:none}.pc>div{flex:1;min-width:0}
@media(max-width:800px){.app{grid-template-columns:minmax(0,1fr)}#sb{border-right:0;border-bottom:1px solid var(--bd)}#nv{position:static;max-height:none;display:flex;gap:4px;overflow-x:auto;padding:6px 8px}.grp,.gb,.gl{display:contents}.gh{display:none}.ni{width:auto;padding:9px 12px}.ni:before,.ni:after{display:none}.g2{grid-template-columns:minmax(0,1fr)}}
main{max-width:1100px;margin:0 auto;padding:18px 16px 50px}
#pend{max-width:1100px;margin:14px auto 0;padding:0 16px}
.strip{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--r);border-radius:12px;padding:10px 16px;box-shadow:var(--sh)}
.strip b.n{font-size:26px;color:var(--r);line-height:1}.tag{padding:2px 10px;border-radius:99px;border:1px solid var(--y);font-size:12px;font-weight:600}.tag.d{border-color:var(--r);color:var(--r)}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 10px}.m{color:var(--mut);font-size:13px;margin:4px 0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:var(--sh);min-width:0}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--cd);border:1px solid var(--bd);border-top:3px solid var(--y);border-radius:12px;padding:12px 14px}.k small{color:var(--mut);text-transform:uppercase;font-size:11px;letter-spacing:.05em}.k b{display:block;font-size:26px;color:var(--r)}.k span{color:var(--mut);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pc{position:relative;display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--bd);border-radius:12px;cursor:pointer;background:var(--bg)}.pc:hover{border-color:var(--y)}.pc.on{border-color:var(--r);background:#fbc02d33}
.pc i{width:40px;height:40px;border-radius:50%;background:var(--r);color:#fff;display:grid;place-items:center;font:700 16px system-ui;font-style:normal}.pc b{text-transform:capitalize}.pc small{display:block;color:var(--mut)}
.x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;border:1px solid var(--r);background:var(--cd);color:var(--r);cursor:pointer;font-size:11px}.x:hover{background:var(--r);color:#fff}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg);border:1.5px solid var(--bd);border-radius:9px;padding:9px 11px;max-width:100%}input:focus,textarea:focus,select:focus{outline:0;border-color:var(--r)}
textarea{width:100%;margin-top:8px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}.row input[type=text]{flex:1;min-width:120px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--r);color:#fff;border:0;border-radius:9px;padding:10px 18px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}.bt:hover{background:var(--y);color:#222}.bt.o{background:transparent;color:var(--r);border:1px solid var(--r)}.bt.o:hover{background:var(--r);color:#fff}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}label.ck{display:flex;gap:6px;align-items:center;font-weight:600;margin-top:6px}.g3 input[type=text]{width:100%}
.msg{min-height:20px;margin-top:8px;font-size:13px}.msg.ok{color:var(--ok)}.msg.e{color:var(--r)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--bd)}th{background:var(--r);color:#fff;font-size:12px;text-transform:uppercase;letter-spacing:.04em}th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
.bar{display:inline-block;vertical-align:middle;width:70px;height:6px;background:var(--bd);border-radius:4px;margin-left:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--y)}
.bs{display:flex;gap:4px;align-items:flex-end;height:150px}.bs div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mut)}.bs i{display:block;width:100%;background:var(--r);border-radius:4px 4px 0 0;opacity:.9}
.bd{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mut)}.bd.ok{color:var(--ok);border-color:var(--ok)}.bd.bad{color:var(--r);border-color:var(--r)}.bad{color:var(--r)}
#ov{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:20px;overflow:auto}#ov[hidden]{display:none}

['devolucao','Código de devolução',`<p>Registra o código de devolução gerado por cada Mercado Livre (Maria, Roberto, Ports 1 e Ports 2). Flex e Gold não têm código.</p><ol><li>Digite o código no campo de cada canal (letras, números e hífen, de 3 a 30 caracteres).</li><li>Clique em <b>Salvar códigos de devolução</b>. A mensagem verde confirma.</li></ol><ul><li>Vale até ser alterado; deixe o campo em branco e salve para remover.</li><li>Aparece na <b>Apresentação Escritório</b>. Se o código não for de hoje, o cartão fica esmaecido com a data em que foi cadastrado.</li></ul><div class="tip">Usa a mesma liberação da área Pedidos.</div>`],
['faltas','Controle de faltas',`<p>Controle diário de presença dos funcionários, com relatório de faltas para imprimir ou salvar.</p><ol><li>Digite o nome em <b>Novo funcionário</b> e clique em <b>Adicionar funcionário</b> (só na primeira vez).</li><li>Escolha o <b>Dia</b> (o padrão é hoje) e marque a situação de cada pessoa: <b>Não chegou ainda</b>, <b>Faltou</b> ou <b>Presente</b>. Se quiser, escreva o motivo.</li><li>Clique em <b>Salvar controle do dia</b>. A mensagem verde confirma.</li></ol><ul><li><b>Relatório de faltas</b>: escolha o período (De/Até) e, se quiser, um funcionário. Escreva a <b>Observação do responsável</b> e clique em <b>Imprimir relatório</b> (também serve para salvar em PDF) ou <b>Baixar relatório (.csv)</b>.</li><li>As faltas e os que ainda não chegaram aparecem hoje na <b>Apresentação Escritório</b>.</li><li>A lixeira remove o funcionário da lista (precisa da permissão Apagar/alterar); as faltas já registradas continuam no relatório.</li></ul><div class="tip">Usa a mesma liberação da área Pedidos. A observação do responsável vale para o relatório que está na tela: confira antes de imprimir ou baixar.</div>`],
['apresescr','Apresentação Escritório',`<p>Painel para TV com o que é tratado no grupo Escritório, atualizado sozinho.</p><ul><li><b>Cartões</b>: pedidos impressos hoje (Flex e Gold), pedidos do dia anterior, coletas de hoje e o próximo corte.</li><li><b>Horário de corte</b> de cada Mercado Livre, com o tempo que falta.</li><li><b>Código de devolução</b> de cada Mercado Livre (sem Flex e Gold).</li><li><b>Faltas e presença de hoje</b>: quem faltou e quem ainda não chegou.</li><li><b>Coletas de hoje</b>: janela, motorista, placa e situação (aguardando, em andamento ou encerrada).</li><li><b>Pedidos por campo</b> e <b>por hora</b>, com os do dia anterior à parte.</li></ul><p>Use <b>Modo TV (tela cheia)</b> para esconder os menus; saia com o mesmo botão ou Esc.</p><div class="tip">Aparece para contas com a área Pedidos ou Coletas liberada.</div>`],

let rU=null,rC=null,rP=null;const lm=(t,k)=>{const e=$('lm');e.textContent=t||'';e.className='msg '+(k||'')};
let SETUP=false;
const ltab=u=>{if(SETUP)return;$('fi').hidden=u;$('fu').hidden=!u;$('lti').classList.toggle('on',!u);$('ltu').classList.toggle('on',u);lm('')};
function checkSetup(){SB.from('kv').select('k').like('k',AC+'/usuarios/%').eq('v->>admin','true').limit(1).then(r=>{if(r.error||(r.data&&r.data.length))return;SETUP=true;$('fi').hidden=true;$('fu').hidden=true;$('fs').hidden=false;const lt=document.querySelector('.lt');if(lt)lt.style.display='none';lm('Nenhum administrador existe ainda. Crie o primeiro para liberar o painel e gerenciar os acessos.','ok')}).catch(()=>{})}
$('fs').onsubmit=async ev=>{ev.preventDefault();const e=$('se').value.trim().toLowerCase(),pw=$('sp').value;
 if(!okMail(e))return lm('Digite um e-mail válido, como nome@empresa.com.','e');if(pw.length<8)return lm('A senha precisa ter pelo menos 8 caracteres.','e');if(pw!==$('sp2').value)return lm('As senhas não são iguais.','e');
 $('bs').disabled=true;try{const salt=crypto.getRandomValues(new Uint8Array(16)),rec={email:e,salt:b64(salt),hash:await hash(pw,salt),mensal:true,admin:true,aprovado:true,areas:{teste:true,bipagem:true,embalagens:true,pedidos:true,separacao:true},podeApagar:true,criado:new Date().toISOString(),criadoPor:'primeiro acesso'};
 const r=await db.ref(AC+'/usuarios/'+uidOf(e)).transaction(c=>c?undefined:rec);if(!r.committed)lm('Este e-mail já tem perfil.','e');else{try{sessionStorage.setItem('mudLogin',uidOf(e))}catch(x){}$('fs').reset();lm('');start(uidOf(e))}}catch(x){lm('Não foi possível criar. Verifique a conexão.','e')}$('bs').disabled=false};
function hdr(){$('ov').hidden=!!sess;$('bo').hidden=!sess;$('ue').textContent=sess?sess.email:''}
function stop(){admOff();clearInterval(HBI);presStop();if(rU)rU.off();if(rC)rC.off();rU=rC=rP=null;rd.h=rd.b=rd.a=rd.extra=0;sbUse([])}
/* O que cada conta baixa e escuta em tempo real */
function grupos(){const g=['contadorPedidos',EXTRA_PATH,BP,SP,CUT,DEV];g.push(sess.admin?AC:AC+'/usuarios/'+sess.uid);if(sess.admin||sess.mensal){g.push(AP);g.push(TOMB);g.push(CFG)}g.push(COL,FAL);return g}
/* ---------- presença (quem está online) — Realtime Presence: não grava nada no banco ---------- */
const EM0=Date.now();let PCH=null,PSUB=false,PTRK='';
function presStart(){if(PCH||!sess)return;PSUB=false;const ch=SB.channel('presenca-online',{config:{presence:{key:sess.uid}}});PCH=ch;
 ch.on('presence',{event:'sync'},()=>{if(PCH!==ch)return;const st=ch.presenceState(),o={};Object.keys(st).forEach(id=>{o[id]={};(st[id]||[]).forEach((m,i)=>{o[id][m.sid||('s'+i)]={em:m.em,onde:m.onde,arq:!!m.arq}})});PRES=o;if((tab==='admin'||tab==='presenca')&&sess&&sess.admin){admDraw();presDraw()}arqSync()})
 .subscribe(st=>{if(PCH!==ch)return;PSUB=st==='SUBSCRIBED';if(PSUB)presTrack(true)})}
function presTrack(force){if(!PCH||!PSUB||!sess)return;const arq=!!(sess.admin||sess.mensal),k=String(arq);if(!force&&k===PTRK)return;PTRK=k;PCH.track({sid:SID,em:EM0,onde:'Sistema unificado',arq}).catch(()=>{})}
function presStop(){if(PCH){const c=PCH;PCH=null;try{c.untrack();SB.removeChannel(c)}catch(e){}}PSUB=false;PTRK='';PRES={}}
/* Só UM aparelho grava o arquivo mensal: o conectado há mais tempo entre admin/monitoramento.
   Antes, todos os aparelhos gravavam a mesma coisa ao mesmo tempo. */
function souLider(){const c=[];Object.values(PRES).forEach(o=>Object.entries(o).forEach(([s,m])=>{if(m.arq)c.push({s,em:+m.em||0})}));if(!c.some(x=>x.s===SID))return false;c.sort((a,b)=>a.em-b.em||(a.s<b.s?-1:a.s>b.s?1:0));return c[0].s===SID}
function out(t){stop();try{localStorage.removeItem('mudLogin');sessionStorage.removeItem('mudLogin')}catch(e){}sess=null;hdr();render();lm(t,t?'e':'')}
function start(uid){stop();sbUse([AC+'/usuarios/'+uid]);rU=db.ref(AC+'/usuarios/'+uid);rU.on('value',s=>{const u=s.val();if(!u||u.aprovado===false)return out(u?'Seu acesso foi bloqueado pelo administrador.':'Seu acesso foi removido pelo administrador.');
 sess={uid,email:u.email,admin:!!u.admin,areas:u.areas||{},mensal:!!u.mensal,pode:u.podeApagar===true};hdr();sbUse(grupos());presStart();presTrack();admWatch();if(sess.admin||sess.mensal)bkInit();if(!ok(tab))tab='apresentacao';render();arqSync();fechaTick()});}
$('lti').onclick=()=>ltab(false);$('ltu').onclick=()=>ltab(true);$('bo').onclick=()=>out('Você saiu da conta.');
$('bt').onclick=()=>{const d=document.documentElement,n=(d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('tema',n)}catch(e){}};
try{const t=localStorage.getItem('tema');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('fu').onsubmit=async ev=>{ev.preventDefault();const e=$('ue2').value.trim().toLowerCase(),pw=$('up').value;
 if(!okMail(e))return lm('Digite um e-mail válido.','e');if(pw.length<8)return lm('A senha precisa ter pelo menos 8 caracteres.','e');if(pw!==$('up2').value)return lm('As senhas não são iguais.','e');
 $('bu').disabled=true;try{const salt=crypto.getRandomValues(new Uint8Array(16)),rec={email:e,salt:b64(salt),hash:await hash(pw,salt),mensal:false,admin:false,aprovado:false,areas:{},podeApagar:false,criado:new Date().toISOString(),criadoPor:'cadastro'};
 const r=await db.ref(AC+'/usuarios/'+uidOf(e)).transaction(c=>c?undefined:rec);if(!r.committed)lm('Este e-mail já está cadastrado.','e');else{$('fu').reset();ltab(false);$('ie').value=e;lm('Conta criada. O administrador precisa liberar o seu cadastro, as áreas e a permissão de apagar.','ok')}}catch(x){lm('Não foi possível criar a conta. Verifique a internet.','e')}$('bu').disabled=false};
const fails={};
$('fi').onsubmit=async ev=>{ev.preventDefault();const e=$('ie').value.trim().toLowerCase(),pw=$('ip').value,f=fails[e]||{n:0,u:0},w=Math.ceil((f.u-Date.now())/1000);
 if(!okMail(e)||!pw)return lm('Digite seu e-mail e sua senha.','e');if(w>0)return lm('Muitas tentativas. Aguarde '+w+' s.','e');
 $('bi').disabled=true;try{const u=(await db.ref(AC+'/usuarios/'+uidOf(e)).once('value')).val(),salt=u&&u.salt?un(u.salt):crypto.getRandomValues(new Uint8Array(16)),h=await hash(pw,salt);
 if(u&&same(h,u.hash)){delete fails[e];if(u.aprovado===false)lm('Seu cadastro ainda não foi liberado pelo administrador.','e');else{try{localStorage.removeItem('mudLogin');sessionStorage.removeItem('mudLogin');($('kp').checked?localStorage:sessionStorage).setItem('mudLogin',uidOf(e))}catch(x){}$('fi').reset();lm('');start(uidOf(e))}}
 else{f.n++;if(f.n>=5){f.u=Date.now()+30000;f.n=0}fails[e]=f;lm('E-mail ou senha incorretos.','e')}}catch(x){lm('Não foi possível entrar. Verifique a internet.','e')}$('bi').disabled=false};
$('bsb').onclick=()=>{const c=document.body.classList.toggle('sbc');try{localStorage.setItem('sbc',c?'1':'0')}catch(e){}};
try{if(localStorage.getItem('sbc')==='1')document.body.classList.add('sbc')}catch(e){}
setInterval(()=>{const c=$('pclk');if(c)c.textContent=new Date().toLocaleTimeString('pt-BR')},1000);
setInterval(()=>{if(sess&&isPres()&&rd.h&&rd.b)refresh();if(sess&&tab==='presenca')presDraw()},60000);
setInterval(()=>{fechaTick()},60000);
hdr();render();checkSetup();
let sid=null;try{sid=sessionStorage.getItem('mudLogin')||localStorage.getItem('mudLogin')}catch(e){}
if(sid)db.ref(AC+'/usuarios/'+sid).once('value').then(s=>{const u=s.val();if(u&&u.aprovado!==false)start(sid)}).catch(()=>{});
</script></body></html>
